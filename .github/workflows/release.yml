name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-prefix: ${{ steps.release.outputs.image-prefix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and source commit
        id: release
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag must be a stable semantic version such as v1.2.3" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          fi
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image-prefix=$REGISTRY/$owner/jitsi-admin-panel" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build candidate (${{ matrix.service }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-adm
            dockerfile: docker/adm.Dockerfile
          - service: api-pri
            dockerfile: docker/pri.Dockerfile
          - service: api-pub
            dockerfile: docker/pub.Dockerfile
          - service: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  verify-candidate:
    name: Verify candidate (${{ matrix.auth }})
    needs: [prepare, build-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        auth: [local, keycloak]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full stack E2E against candidate images
        env:
          APP_IMAGE_PREFIX: ${{ needs.prepare.outputs.image-prefix }}
          APP_IMAGE_TAG: ${{ needs.prepare.outputs.version }}
          E2E_USE_RELEASE_IMAGES: "true"
        run: ./e2e/run.sh ${{ matrix.auth }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-${{ matrix.auth }}
          path: frontend/test-results
          if-no-files-found: ignore

  promote:
    name: Promote candidate to latest
    needs: [prepare, verify-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote verified image set
        env:
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image-prefix }}
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/promote-images.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          fi
